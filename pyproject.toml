[project]
name = "rbf"
version = "0.1.0"
description = "retail-bias-factor: 개인투자자 행동 편향의 흔적으로 만든 역발상 팩터 (연구 코드)"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py312"
